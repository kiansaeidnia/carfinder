[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carfinder"
version = "0.1.0"
description = "Watch Australian car listing sites for a Kia EV6, BYD Sealion 7 or Subaru Solterra near Cairns"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
carfinder = "carfinder.cli:main"

[tool.setuptools.packages.find]
include = ["carfinder*"]
